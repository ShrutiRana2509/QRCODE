<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Code Generator & Scanner</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

    <div class="container mt-5">
        <h1 class="text-center mb-4">QR Code Generator & Scanner</h1>
        <div class="row">
            <!-- QR Code Generator Section -->
            <div id="generator" class="col-md-6">
                <div class="shadow p-4 rounded bg-light">
                    <h3 class="text-center">Generate QR Code</h3>
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="url" class="form-label">Enter URL:</label>
                            <input type="text" id="url" name="url" class="form-control" placeholder="Enter a URL" required>
                        </div>
                        <div class="text-center">
                            <button type="submit" name="generate" class="btn btn-primary btn-lg">Generate QR Code</button>
                        </div>
                    </form>
                    {% if qr_image %}
                    <div class="mt-4 text-center">
                        <h5>Generated QR Code:</h5>
                        <img src="data:image/png;base64,{{ qr_image }}" alt="QR Code" class="img-thumbnail">
                        <p class="mt-2"><strong>URL:</strong> {{ request.POST.url }}</p>
                    </div>
                    {% endif %}
                </div>
            </div>

            <!-- QR Code Scanner Section -->
          <div id="scanner" class="col-md-6">
                <div class="shadow p-4 rounded bg-light">
                    <h3 class="text-center">Scan QR Code</h3>
                    <form method="POST" enctype="multipart/form-data">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="qr_image" class="form-label">Upload QR Code Image:</label>
                            <input type="file" name="qr_image" id="qr_image" class="form-control" accept="image/*" required>
                        </div>
                        <div class="text-center">
                            <button type="submit" name="scan" class="btn btn-success btn-lg">Scan QR Code</button>
                        </div>
                    </form>
                    {% if scanned_text %}
                    <div class="mt-4 text-center">
                        <h5>Scanned Result:</h5>
                        <div class="alert alert-info">
                            {{ scanned_text }}
                        </div>
                    </div>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>

    <!-- Footer Section -->
    <footer id="about" class="text-center mt-5">
        <small>&copy; Shruti Rana</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
